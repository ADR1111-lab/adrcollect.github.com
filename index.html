<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#101827">
    <title>Public file drop</title>
    <link rel="stylesheet" href="styles.css">
    <script src="jacri.js" defer></script>
</head>
<body>
    <main class="page">
        <header class="page-header">
            <p class="eyebrow">FILE SHARING</p>
            <h1>Public file drop</h1>
            <p class="intro">Upload a file to share it. Uploaded files are public to anyone with this page.</p>
        </header>

        <section class="panel" aria-labelledby="upload-heading">
            <h2 id="upload-heading">Upload files</h2>
            <form id="upload-form">
                <label class="field-label" for="file-input">Choose one or more files</label>
                <input id="file-input" name="files" type="file" multiple required>

                <label class="field-label" for="upload-password">Upload password</label>
                <input id="upload-password" name="password" type="password" autocomplete="current-password" required>
                <p class="field-hint">The password is checked by your backend and is not saved by this page.</p>

                <button id="upload-button" type="submit">Upload files</button>
                <p id="upload-status" class="status" role="status" aria-live="polite"></p>
            </form>
        </section>

        <section class="file-section" aria-labelledby="files-heading">
            <div class="section-heading">
                <div>
                    <p class="eyebrow">SHARED FILES</p>
                    <h2 id="files-heading">Available to everyone</h2>
                </div>
                <button id="refresh-button" class="secondary-button" type="button">Refresh</button>
            </div>
            <p id="files-status" class="status" role="status" aria-live="polite"></p>
            <ul id="file-list" class="file-list"></ul>
        </section>
    </main>
</body>
</html>
