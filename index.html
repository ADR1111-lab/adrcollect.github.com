<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#111827">
    <title>My file library</title>
    <link rel="stylesheet" href="styles.css">
    <script src="javascript.js" defer></script>
</head>
<body>
    <main class="page">
        <header class="page-header">
            <p class="eyebrow">FILE LIBRARY</p>
            <h1>Photos and files</h1>
            <p class="intro">Enter the password to see and download files.</p>
        </header>

        <section id="lock-panel" class="panel" aria-labelledby="lock-heading">
            <h2 id="lock-heading">Password required</h2>
            <form id="unlock-form">
                <label class="field-label" for="password-input">Password</label>
                <input id="password-input" name="password" type="password" autocomplete="current-password" required>
                <button id="unlock-button" type="submit">Unlock files</button>
                <p id="lock-status" class="status" role="status" aria-live="polite"></p>
            </form>
        </section>

        <section id="library-panel" class="library" hidden aria-labelledby="files-heading">
            <div class="section-heading">
                <div>
                    <p class="eyebrow">AVAILABLE FILES</p>
                    <h2 id="files-heading">Download a file</h2>
                </div>
                <div class="actions">
                    <button id="refresh-button" class="secondary-button" type="button">Refresh</button>
                    <button id="lock-button" class="secondary-button" type="button">Lock</button>
                </div>
            </div>
            <p id="files-status" class="status" role="status" aria-live="polite"></p>
            <ul id="file-list" class="file-list"></ul>
        </section>
    </main>
</body>
</html>
